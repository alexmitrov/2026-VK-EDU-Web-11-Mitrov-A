{% extends 'core/layout/base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <h2 class="h3 mb-4">Авторизация</h2>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="loginInput" class="form-label">Логин</label>
                <input type="text" class="form-control border-dark" id="loginInput" name="username" placeholder="Введите свой логин" required>
            </div>

            <div class="mb-3">
                <label for="passwordInput" class="form-label">Пароль</label>
                <input type="password" class="form-control border-dark" id="passwordInput" name="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-primary mb-3">Войти</button>

            <div>
                <a href="{% url 'signup' %}" class="text-decoration-none">Нет аккаунта? Создайте сейчас!</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
