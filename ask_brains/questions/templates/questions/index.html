{% extends 'questions/layout/base.html' %}
{% load static %}

{% block content %}
<div class="col-12 col-md-8 col-lg-9">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Новые вопросы</h2>
        <a href="{% url 'hot' %}" class="text-decoration-none">Популярные вопросы</a>
    </div>
    {% for question in questions %}
        {% include 'questions/partials/question.html' with obj=question %}
    {% endfor %}
    {% include 'questions/partials/pagination.html' %}
</div>
{% endblock %}
