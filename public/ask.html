<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBrains - Задать вопрос</title>
    <link rel="icon" href="static/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="bg-white border-bottom py-3 mb-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12 col-md-3 mb-3 mb-md-0">
                    <a href="index.html" class="text-decoration-none fs-3 fw-bold text-dark">AskBrains</a>
                </div>

                <div class="col-12 col-md-5 mb-3 mb-md-0">
                    <form class="d-flex" action="index.html" method="GET">
                        <div class="input-group me-3">
                            <input class="form-control" type="search" name="q" placeholder="Search" aria-label="Search">
                            <button class="btn btn-outline-secondary text-nowrap" type="submit">Найти</button>
                        </div>

                        <a href="ask.html" class="btn btn-outline-success text-nowrap">ASK!</a>
                    </form>
                </div>

                <div class="col-12 col-md-4 d-flex justify-content-md-end align-items-center">
                    <div class="d-flex gap-2">
                        <a href="login.html" class="text-decoration-none">вход</a>
                        <a href="signup.html" class="text-decoration-none">регистрация</a>
                    </div>

<!--                    <div class="d-flex align-items-center gap-2">-->
<!--                        <img src="static/img/avatar.jpeg" alt="Avatar" class="rounded" width="32" height="32">-->
<!--                        <div class="d-flex flex-column" style="line-height: 1.2;">-->
<!--                            <span class="fw-bold">Mr. Pelican</span>-->
<!--                            <div class="small">-->
<!--                                <a href="profile.html" class="text-decoration-none">настройки</a>-->
<!--                                <a href="#" class="text-decoration-none text-danger">выход</a>-->
<!--                            </div>-->
<!--                        </div>-->
<!--                    </div>-->
                </div>
            </div>
        </div>
    </header>

    <main class="container flex-grow-1">
        <div class="row">
            <div class="col-12 col-md-9">
                <h2 class="h3 mb-4">Новый вопрос</h2>
                <form>
                    <div class="mb-3">
                        <label for="qTitle" class="form-label">Заголовок</label>
                        <input type="text" class="form-control border-dark" id="qTitle" placeholder="Придумайте название вопросу">
                        <div class="form-text">Максимум 150 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="qText" class="form-label">Текст</label>
                        <textarea class="form-control border-dark" id="qText" rows="6" placeholder="Расскажите о вашем вопросе"></textarea>
                        <div class="form-text">Опишите вопрос подробнее (до 3000 символов)</div>
                    </div>
                    <div class="mb-3">
                        <label for="qTags" class="form-label">Тэги</label>
                        <input type="text" class="form-control border-dark" id="qTags" placeholder="Напишите тэги">
                    </div>
                    <button type="submit" class="btn btn-primary">ASK!</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-3 mt-5">
        <div class="container text-center">
            Пустой футер
        </div>
    </footer>

    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
