                <div class="col-12 col-md-5 mb-3 mb-md-0">
                    <form class="d-flex" action="index.html" method="GET">
                        <div class="input-group me-3">
                            <input class="form-control" type="search" name="q" placeholder="Search" aria-label="Search">
                            <button class="btn btn-outline-secondary text-nowrap" type="submit">Найти</button>
                        </div>

                        <a href="ask.html" class="btn btn-outline-success text-nowrap">ASK!</a>
                    </form>
                </div>

                <div class="col-12 col-md-4 d-flex justify-content-md-end align-items-center">
                    <div class="d-flex gap-2">
                        <a href="login.html" class="text-decoration-none">вход</a>
                        <a href="signup.html" class="text-decoration-none">регистрация</a>
                    </div>

                </div>
            </div>
        </div>

    <main class="container flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <h2 class="h3 mb-4">Авторизация</h2>

                <div class="alert alert-danger" role="alert">
                    Неверное имя или пароль
                </div>

                <form>
                    <div class="mb-3">
                        <label for="loginInput" class="form-label">Логин</label>
                        <input type="text" class="form-control border-dark" id="loginInput" placeholder="Введите свой логин">
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Пароль</label>
                        <input type="password" class="form-control border-dark" id="passwordInput" placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-primary mb-3">Войти</button>
                    <div>
                        <a href="signup.html" class="text-decoration-none">Нет аккаунта? Создайте сейчас!</a>
                    </div>
                </form>
            </div>
        </div>
